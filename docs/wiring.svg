<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
<title>pi.thermostat wiring diagram</title>
<rect x="0" y="0" width="1200" height="980" rx="0" fill="#fbfaf6" stroke="none" stroke-width="0"/>
<text x="600" y="38" font-size="26" text-anchor="middle" fill="#222" font-weight="bold">pi.thermostat wiring</text>
<text x="600" y="62" font-size="14" text-anchor="middle" fill="#555">Raspberry Pi 3B  →  4-channel relay board  →  furnace / AC control board (24 VAC, low voltage)</text>
