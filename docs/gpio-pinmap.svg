<text x="580" y="455" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">14</text>
<text x="630" y="456" font-size="14" text-anchor="start" fill="#555">GND</text>
<circle cx="520" cy="497" r="12" fill="#ced4da"/>
<text x="520" y="501" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">15</text>
<text x="470" y="502" font-size="14" text-anchor="end" fill="#555">GPIO 22</text>
<circle cx="580" cy="497" r="12" fill="#ced4da"/>
<text x="580" y="501" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">16</text>
