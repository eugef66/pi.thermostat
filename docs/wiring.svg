<text x="897" y="498" font-size="11" text-anchor="end" fill="#c92a2a" font-weight="bold">R (24 VAC) to every COM</text>
<rect x="30" y="870" width="560" height="90" rx="10" fill="#fff8e1" stroke="#e0a800" stroke-width="1.5"/>
<text x="44" y="893" font-size="12.5" text-anchor="start" fill="#222">• Switch the furnace/AC OFF at the breaker before touching any wire.</text>
<text x="44" y="913" font-size="12.5" text-anchor="start" fill="#222">• Connect ONE controller to W1/W2/Y/G: disconnect the smart thermostat.</text>
<text x="44" y="933" font-size="12.5" text-anchor="start" fill="#222">• Use NO, never NC: if the Pi loses power the equipment stops calling.</text>
<text x="44" y="953" font-size="12.5" text-anchor="start" fill="#222">• Crossing lines are not connected unless there is a dot.</text>
<text x="1180" y="960" font-size="11" text-anchor="end" fill="#888" font-style="italic">Wire colours are conventions; yours may differ.</text>
</svg>