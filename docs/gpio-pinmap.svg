<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1370" width="1100" height="1370" font-family="DejaVu Sans, Verdana, Arial, sans-serif">
<title>Raspberry Pi 3B GPIO pin map for pi.thermostat</title>
<rect x="0" y="0" width="1100" height="1370" rx="0" fill="#fbfaf6" stroke="none" stroke-width="0"/>
<text x="550" y="40" font-size="26" text-anchor="middle" fill="#222" font-weight="bold">Raspberry Pi 3B — 40-pin GPIO header</text>
<text x="550" y="64" font-size="14" text-anchor="middle" fill="#555">Pin = physical position on the header.  GPIO n = the BCM number you put in config.toml.</text>
<text x="550" y="86" font-size="14" text-anchor="middle" fill="#555">Highlighted rows are the pins pi.thermostat uses.</text>
