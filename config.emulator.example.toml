# Laptop / development configuration: fake relays and a fake sensor, plain HTTP on localhost.
# Copy to config.toml and follow docs/EMULATOR.md.   NEVER use these settings on a real install.

[hardware]
emulate = true              # relay pins live in data/emulated_pins.json, sensor in data/emulated_sensor.json
heat1_pin = 2
cool_pin = 3
heat2_pin = 5
fan_pin = 6

[control]
timezone = "America/New_York"
# For quick experiments you can shrink the protection timers (seconds):
#heat_min_on_s = 10
#heat_min_off_s = 10
#cool_min_on_s = 10
#cool_min_off_s = 20
#changeover_s = 20
#deadman_s = 30

[auth]
cookie_secure = false       # required because tls = false

[server]
host = "127.0.0.1"          # this computer only
port = 8080
tls = false
engine = "wsgiref"          # stdlib server, no extra packages needed
cert_check_s = 60
watchdog_interval_s = 5
