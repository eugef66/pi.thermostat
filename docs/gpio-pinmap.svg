<circle cx="580" cy="1003" r="12" fill="#ced4da"/>
<text x="580" y="1007" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">38</text>
<text x="630" y="1008" font-size="14" text-anchor="start" fill="#555">GPIO 20 · PCM</text>
<circle cx="520" cy="1049" r="12" fill="#343a40"/>
<text x="520" y="1053" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">39</text>
<text x="470" y="1054" font-size="14" text-anchor="end" fill="#555">GND</text>
<circle cx="580" cy="1049" r="12" fill="#ced4da"/>
<text x="580" y="1053" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">40</text>
<text x="630" y="1054" font-size="14" text-anchor="start" fill="#555">GPIO 21 · PCM</text>
<rect x="40" y="1115" width="500" height="150" rx="10" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="56" y="1141" font-size="15" text-anchor="start" fill="#222" font-weight="bold">Finding pin 1</text>
<text x="56" y="1165" font-size="12.5" text-anchor="start" fill="#333">Pin 1 (the square one) is at the end of the header</text>
<text x="56" y="1185" font-size="12.5" text-anchor="start" fill="#333">nearest the SD card slot. Odd pins are the row on the</text>
<text x="56" y="1205" font-size="12.5" text-anchor="start" fill="#333">inner side; even pins (2, 4, 6 …) run along the board’s</text>
<text x="56" y="1225" font-size="12.5" text-anchor="start" fill="#333">outer edge, so the 5V pins sit at the outer corner.</text>
<text x="56" y="1245" font-size="12.5" text-anchor="start" fill="#333">Count pins from the SD card end; check it before powering on.</text>
<rect x="560" y="1115" width="500" height="150" rx="10" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="576" y="1141" font-size="15" text-anchor="start" fill="#222" font-weight="bold">config.toml names</text>
<text x="576" y="1167" font-size="12.5" text-anchor="start" fill="#222">sensor_pin = 4     DHT22 data      (pin 7)</text>
<text x="576" y="1186" font-size="12.5" text-anchor="start" fill="#222">heat1_pin  = 2     relay IN1 / W1  (pin 3)</text>
<text x="576" y="1205" font-size="12.5" text-anchor="start" fill="#222">cool_pin   = 3     relay IN2 / Y   (pin 5)</text>
<text x="576" y="1224" font-size="12.5" text-anchor="start" fill="#222">heat2_pin  = 5     relay IN3 / W2  (pin 29)</text>
<text x="576" y="1243" font-size="12.5" text-anchor="start" fill="#222">fan_pin    = 6     relay IN4 / G   (pin 31)</text>
<circle cx="50" cy="1287" r="10" fill="#f08c00"/>
<text x="68" y="1292" font-size="13" text-anchor="start" fill="#222">3.3 V</text>
<circle cx="151" cy="1287" r="10" fill="#c92a2a"/>
<text x="169" y="1292" font-size="13" text-anchor="start" fill="#222">5 V</text>
<circle cx="234" cy="1287" r="10" fill="#343a40"/>
<text x="252" y="1292" font-size="13" text-anchor="start" fill="#222">Ground</text>
<circle cx="344" cy="1287" r="10" fill="#ced4da"/>
<text x="362" y="1292" font-size="13" text-anchor="start" fill="#222">GPIO</text>
<circle cx="436" cy="1287" r="10" fill="#ffa8a8"/>
<text x="454" y="1292" font-size="13" text-anchor="start" fill="#222">ID EEPROM (leave alone)</text>
<circle cx="699" cy="1287" r="10" fill="#fff" stroke="#1c7ed6" stroke-width="3"/>
<text x="717" y="1292" font-size="13" text-anchor="start" fill="#222">used here</text>
<text x="40" y="1321" font-size="12" text-anchor="start" fill="#2b8a3e">Green GPIO names (GPIO 0–8) are pulled HIGH by the Pi from the moment power is applied. With active-low relays HIGH means OFF,</text>
<text x="40" y="1339" font-size="12" text-anchor="start" fill="#2b8a3e">so a relay on one of those pins cannot click on during boot. GPIO 9–27 default LOW. GPIO 2 and 3 also have fixed 1.8k pull-ups on the board.</text>
</svg>