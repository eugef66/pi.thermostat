<text x="470" y="686" font-size="14" text-anchor="end" fill="#555">GPIO 11 · SCLK</text>
<circle cx="580" cy="681" r="12" fill="#ced4da"/>
<text x="580" y="685" font-size="11" text-anchor="middle" fill="#222" font-weight="bold">24</text>
<text x="630" y="686" font-size="14" text-anchor="start" fill="#2b8a3e" font-weight="bold">GPIO 8 · CE0</text>
